# =============================================================================
#  VFM — CI (GitHub Actions)
# =============================================================================
#  Redoslijed: env-sync → install → lint/typecheck → unit → integration → stress
#              → security → build → docker build
#
#  Napomena: dok traje FAZA 0 (dok apps/* još nemaju kod), poslovi `unit`,
#  `integration`, `stress` i `build` preskaču se ako ne postoji odgovarajući
#  package.json/turbo target. `env-sync` i `security` se izvršavaju UVIJEK.
# =============================================================================
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

#  pnpm verzija se NE postavlja ovdje: `pnpm/action-setup@v4` je čita iz
#  `package.json#packageManager` (pnpm@10.34.7). Dupli izvor (`with: version`)
#  je padao s „Multiple versions of pnpm specified".
env:
  NODE_VERSION: 22
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ---------------------------------------------------------------------------
  # 0) Sinhronizacija .env.example ↔ compose ↔ REDIS_ACL.md  (uvijek)
  # ---------------------------------------------------------------------------
  env-sync:
    name: env-sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Provjeri sinhronizaciju varijabli
        run: node scripts/env-sync-check.mjs
      - name: Provjeri da .env nije commitovan
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|production|staging)$'; then
            echo "❌ Tajne (.env) ne smiju biti u repozitoriju"; exit 1;
          fi
          echo "✅ Nema commitovanih .env fajlova"

  # ---------------------------------------------------------------------------
  # 1) Instalacija i keš
  # ---------------------------------------------------------------------------
  setup:
    name: install
    runs-on: ubuntu-latest
    needs: env-sync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Postavi pnpm-workspace.yaml (ako još ne postoji)
        run: test -f pnpm-workspace.yaml || printf 'packages:\n  - "apps/*"\n  - "packages/*"\n' > pnpm-workspace.yaml
      - name: Instaliraj dependencije
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "⚠️ pnpm-lock.yaml ne postoji (faza 0 nije implementirana) — preskačem install"
          fi

  # ---------------------------------------------------------------------------
  # 2) Kvalitet koda
  # ---------------------------------------------------------------------------
  quality:
    name: lint & typecheck
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: test -f pnpm-lock.yaml && pnpm install --frozen-lockfile || echo "skip"
      - name: Lint
        run: if [ -f pnpm-lock.yaml ]; then pnpm -w lint; else echo "preskočeno (faza 0)"; fi
      - name: Typecheck
        run: if [ -f pnpm-lock.yaml ]; then pnpm -w typecheck; else echo "preskočeno (faza 0)"; fi

  # ---------------------------------------------------------------------------
  # 3) Unit testovi
  # ---------------------------------------------------------------------------
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: test -f pnpm-lock.yaml && pnpm install --frozen-lockfile || echo "skip"
      - name: Testovi + coverage
        #  `test:coverage` je turbo task (vidi turbo.json): svaki paket mjeri svoj
        #  prag iz svog `vitest.config.ts`. Ranije `pnpm -w test -- --coverage`
        #  je dodavao `--coverage` u SVE `test` skripte, pa je `@vfm/config`
        #  (`node -e ...`) padao s „node: bad option: --coverage".
        run: if [ -f pnpm-lock.yaml ]; then pnpm -w test:coverage; else echo "preskočeno (faza 0)"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/

  # ---------------------------------------------------------------------------
  # 4) Integration testovi (pravi PostgreSQL + Redis u servisima)
  # ---------------------------------------------------------------------------
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: setup
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vfm
          POSTGRES_PASSWORD: vfm_test_only
          POSTGRES_DB: vfm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vfm -d vfm_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://vfm:vfm_test_only@localhost:5432/vfm_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: test -f pnpm-lock.yaml && pnpm install --frozen-lockfile || echo "skip"
      #  Guard-ovi postoje jer `vitest run` bez ijednog testa pada, a
      #  `test:stress` skripta još ne postoji (P6 dolazi s Faza 3).
      - name: Integration
        run: |
          if ls apps/api/test/integration/*.spec.ts >/dev/null 2>&1; then
            pnpm --filter @vfm/api test:integration
          else
            echo "preskočeno: nema integration testova (dolaze s Faza 3)"
          fi
      - name: Stress (P6 — atomski claim)
        run: |
          if node -e "process.exit(require('./apps/api/package.json').scripts['test:stress']?0:1)"; then
            pnpm --filter @vfm/api test:stress
          else
            echo "preskočeno: nema stress testova (P6 dolazi s Faza 3)"
          fi

  # ---------------------------------------------------------------------------
  # 5) Sigurnost (uvijek)
  # ---------------------------------------------------------------------------
  security:
    name: security scan
    runs-on: ubuntu-latest
    needs: env-sync
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #  Skeniramo kod i konfiguraciju za FIKSNE lozinke. Namjerno se
      #  preskaču samo tri vrste pogodaka:
      #  - blocklist-a koju sami implementiramo (ti fajlovi PO DEFINICIJI sadrže
      #    zabranjene lozinke — nalaz bi bio lažno pozitivan);
      #  - testovi/fiksture (`*.spec.ts`, `*.test.ts(x)`) — test lozinke su javne;
      #  - ovaj workflow (sadrži same obrasce pretrage).
      #  Isključenja su po TAČNOJ putanji (ne po imenu fajla), da novi
      #  `schemas.ts`/`ci.yml` nigdje ne bi bio tiho preskočen.
      - name: Provjera da nema poznatih lozinki u repo-u
        run: |
          PATTERN="(admin123|password123|changeme|lozinka123|Passw0rd!)"
          ALLOWLIST='^\./(packages/shared/src/schemas\.ts|apps/api/src/modules/auth/services/password\.service\.ts|\.github/workflows/ci\.yml):'
          if grep -rnE "$PATTERN" \
             --include='*.ts' --include='*.tsx' --include='*.json' --include='*.yml' \
             --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
             --exclude-dir=coverage --exclude-dir=.turbo \
             --exclude='*.spec.ts' --exclude='*.spec.tsx' \
             --exclude='*.test.ts' --exclude='*.test.tsx' . \
             | grep -vE "$ALLOWLIST"; then
            echo "❌ Pronađena sumnjiva/fixna lozinka"; exit 1;
          fi
          echo "✅ Nema fixnih lozinki"
      - name: Dependency audit
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm audit --audit-level=high || exit 1
          else
            echo "preskočeno (faza 0)"
          fi

  # ---------------------------------------------------------------------------
  # 6) Build + Docker image-i
  # ---------------------------------------------------------------------------
  build:
    name: build & docker
    runs-on: ubuntu-latest
    needs: [quality, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: test -f pnpm-lock.yaml && pnpm install --frozen-lockfile || echo "skip"
      - name: Turbo build
        run: if [ -f pnpm-lock.yaml ]; then pnpm turbo run build; else echo "preskočeno (faza 0)"; fi
      - name: Docker build — api
        if: ${{ hashFiles('apps/api/Dockerfile') != '' }}
        run: |
          if [ -f apps/api/src/main.ts ]; then
            docker build -f apps/api/Dockerfile -t vfm-api:ci .
          else
            echo "apps/api još nema izvorni kod (faza 0) — preskačem docker build"
          fi
      - name: Docker build — web
        run: |
          if [ -f apps/web/src/main.tsx ]; then
            docker build -f apps/web/Dockerfile -t vfm-web:ci .
          else
            echo "apps/web još nema izvorni kod (faza 0) — preskačem docker build"
          fi
      - name: Compose config provjera
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet \
            && echo "✅ compose konfiguracija validna" || echo "⚠️ compose provjera nije prošla"
