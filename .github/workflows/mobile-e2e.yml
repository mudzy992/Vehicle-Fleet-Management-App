name: Mobile E2E

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "apps/mobile/**"
      - "apps/api/src/**"
      - "apps/api/prisma/**"
      - "packages/shared/src/**"
      - "packages/form-engine/**"
      - "packages/form-renderer/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/api/src/**"
      - "apps/api/prisma/**"
      - "packages/shared/src/**"
      - "packages/form-engine/**"
      - "packages/form-renderer/**"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-task-create:
    name: P4 Maestro task-create (isolated CI stack)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vfm
          POSTGRES_PASSWORD: vfm_mobile_e2e_only
          POSTGRES_DB: vfm_mobile_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vfm -d vfm_mobile_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://vfm:vfm_mobile_e2e_only@localhost:5432/vfm_mobile_e2e?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instaliraj root workspace pakete
        run: pnpm install --frozen-lockfile
      - name: Izgradi pakete koji se dijele s mobilnom aplikacijom
        run: |
          pnpm --filter @vfm/shared build
          pnpm --filter @vfm/form-engine build
      - name: Generiši Prisma client
        run: pnpm --filter @vfm/api prisma:generate
      - name: Migriraj samo disposable E2E bazu
        env:
          ENV_PROFILE: tool
          NODE_ENV: production
        run: pnpm --filter @vfm/api prisma:migrate:deploy
      - name: Instaliraj zasebne Expo zavisnosti
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile
      - name: Seed konfiguraciju i fiktivne E2E podatke
        env:
          ENV_PROFILE: tool
          NODE_ENV: production
          SEED_DEMO_DATA: "true"
        run: |
          set -euo pipefail
          seed_log="$RUNNER_TEMP/mobile-e2e-seed.log"
          trap 'rm -f "$seed_log"' EXIT
          if ! pnpm --filter @vfm/api seed >"$seed_log" 2>&1; then
            sed -E 's/(admin@vfm\.local|vozac@vfm\.local).*/\1 [MASKED]/' "$seed_log" | tail -n 40
            exit 1
          fi
          SEED_LOG_PATH="$seed_log" node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync, readFileSync } from 'node:fs';
          const log = readFileSync(process.env.SEED_LOG_PATH, 'utf8');
          const passwordFor = (email) => {
            const line = log.split(/\r?\n/u).find((entry) => entry.includes(email) && entry.includes('→'));
            return line?.slice(line.lastIndexOf('→') + 1).trim();
          };
          const adminPassword = passwordFor('admin@vfm.local');
          const userPassword = passwordFor('vozac@vfm.local');
          if (!adminPassword || !userPassword) throw new Error('Seed nije izdao oba jednokratna demo naloga.');
          const testAdminPassword = randomBytes(32).toString('hex');
          const testUserPassword = randomBytes(32).toString('hex');
          for (const password of [adminPassword, userPassword, testAdminPassword, testUserPassword]) {
            console.log(`::add-mask::${password}`);
          }
          appendFileSync(process.env.GITHUB_ENV, [
            'TEST_ADMIN_EMAIL=admin@vfm.local',
            `TEST_ADMIN_PASSWORD=${testAdminPassword}`,
            'TEST_USER_EMAIL=vozac@vfm.local',
            `TEST_USER_PASSWORD=${testUserPassword}`,
            `TEST_RUN_ID=${process.env.GITHUB_RUN_ID}`,
            '',
          ].join('\n'));
          NODE
          rm -f "$seed_log"
      - name: Postavi sigurne ASCII lozinke za privremene E2E naloge
        working-directory: apps/api
        env:
          ENV_PROFILE: tool
          NODE_ENV: test
        run: pnpm exec tsx src/tools/reset-p4-e2e-users.ts
      - name: Napravi kratkotrajne API tajne za ovaj job
        run: |
          {
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Izgradi kompajlirani API za E2E
        run: pnpm --filter @vfm/api build
      - name: Pokreni API samo nad disposable CI PostgreSQL/Redis servisima
        env:
          ENV_PROFILE: api
          NODE_ENV: test
          API_HOST: 0.0.0.0
          API_PORT: "3000"
          LOG_LEVEL: warn
        run: |
          set -euo pipefail
          nohup pnpm --filter @vfm/api start >"$RUNNER_TEMP/mobile-e2e-api.log" 2>&1 </dev/null &
          api_pid=$!
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/live >/dev/null; then
              echo "E2E API is ready on the local runner."
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API process exited before the local health probe succeeded."
              break
            fi
            sleep 2
          done
          tail -n 60 "$RUNNER_TEMP/mobile-e2e-api.log" \
            | sed -E 's#(postgres(ql)?://[^:/@]+:)[^@/]+@#\1[MASKED]@#g; s#(JWT_(ACCESS|REFRESH)_SECRET=).*#\1[MASKED]#g' \
            | while IFS= read -r line; do echo "::error title=E2E API startup log::$line"; done
          exit 1
      - name: Instaliraj Maestro CLI
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version
      - name: Provjeri samo lokalnu prijavu P4 test naloga
        env:
          P4_E2E_API_URL: http://127.0.0.1:3000/api/v1
        run: node apps/mobile/scripts/verify-p4-auth.mjs
      - name: Izgradi Android APK prije pokretanja emulatora
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:3000/api/v1
        run: |
          set -euo pipefail
          build_log="$RUNNER_TEMP/android-apk-build.log"
          if ! { corepack pnpm exec expo prebuild --platform android --no-install && (cd android && ./gradlew --no-daemon assembleRelease); } >"$build_log" 2>&1; then
            tail -n 40 "$build_log" | while IFS= read -r line; do echo "::error title=Android APK build::$line"; done
            exit 1
          fi
          test -s android/app/build/outputs/apk/release/app-release.apk
          echo "Release APK built successfully without an active emulator."
      - name: Omogući KVM ubrzanje za emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Android emulator build i P4 UI/API acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash apps/mobile/scripts/run-p4-e2e-ci.sh
      - name: Sačuvaj Android UI i crash dijagnostike
        if: failure()
        run: |
          set +e
          debug_dir="$RUNNER_TEMP/maestro-debug-admin"
          mkdir -p "$debug_dir"
          echo '::group::Android emulator state'
          timeout 10s adb devices -l | while IFS= read -r line; do echo "::error title=Android device::$line"; done || true
          timeout 10s adb shell dumpsys activity activities 2>/dev/null \
            | grep -E 'mResumedActivity|topResumedActivity|mFocusedActivity' \
            | tail -n 5 \
            | while IFS= read -r line; do echo "::error title=Android activity::$line"; done || true
          timeout 15s adb exec-out screencap -p > "$debug_dir/failure-screen.png" || rm -f "$debug_dir/failure-screen.png"
          timeout 15s adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
          timeout 10s adb shell cat /sdcard/window.xml > "$RUNNER_TEMP/mobile-e2e-window.xml" || true
          python3 - "$RUNNER_TEMP/mobile-e2e-window.xml" "$debug_dir/window-sanitized.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          source, destination = sys.argv[1:]
          try:
              root = ET.parse(source).getroot()
          except (OSError, ET.ParseError) as error:
              print(f'UI hierarchy unavailable: {error}')
              raise SystemExit(0)
          nodes = []
          for node in root.iter('node'):
              text = node.attrib.get('text', '')
              description = node.attrib.get('content-desc', '')
              if '@' in text or '@' in description:
                  text = description = '[MASKED EMAIL]'
              if node.attrib.get('password') == 'true':
                  text = description = '[MASKED PASSWORD]'
              node.attrib['text'] = text
              node.attrib['content-desc'] = description
              if any((text, description, node.attrib.get('resource-id'), node.attrib.get('focused') == 'true')):
                  nodes.append(
                      f"text={text!r} desc={description!r} id={node.attrib.get('resource-id', '')!r} "
                      f"focused={node.attrib.get('focused', '')} clickable={node.attrib.get('clickable', '')} "
                      f"bounds={node.attrib.get('bounds', '')}"
                  )
          ET.ElementTree(root).write(destination, encoding='unicode')
          print('UI hierarchy (sensitive values masked):')
          for line in nodes[:15]:
              print(f'::error title=Android UI hierarchy::{line}')
          PY
          timeout 15s adb logcat -d -t 500 2>/dev/null \
            | grep -E 'ReactNativeJS|AndroidRuntime|ActivityTaskManager|FATAL EXCEPTION|Expo|ReactNative' \
            | tail -n 10 \
            | sed -E -e 's/admin@vfm[.]local|vozac@vfm[.]local/[MASKED EMAIL]/g' \
                -e "s/${TEST_ADMIN_PASSWORD:-}/[MASKED]/g" -e "s/${TEST_USER_PASSWORD:-}/[MASKED]/g" \
            | while IFS= read -r line; do echo "::error title=Android runtime diagnostic::$line"; done || true
          echo '::endgroup::'
          rm -f "$RUNNER_TEMP/mobile-e2e-window.xml"
      - name: Sačuvaj očišćene Maestro dijagnostike
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-maestro-diagnostics
          path: ${{ runner.temp }}/maestro-debug-*
          if-no-files-found: ignore
          retention-days: 1
