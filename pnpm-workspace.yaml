# =============================================================================
#  VFM — pnpm workspace
# =============================================================================
#  ⚠️ `apps/mobile` (Expo) NAMJERNO nije član workspace-a:
#     - Expo/React Native ima zaseban build lanac (EAS) i lockfile,
#     - ne builda se u Dockeru niti se spaja s root workspace zavisnostima,
#     - ima zaseban CI job za typecheck i Android JS export (Faza 6),
#     - instalira se zasebno:  cd apps/mobile && pnpm install.
# =============================================================================
packages:
  - "packages/*"
  - "apps/api"
  - "apps/web"

# pnpm 10: eksplicitna kontrola postinstall skripti dependencija (sigurnost)
onlyBuiltDependencies:
  - esbuild

# Prisma preuzima engine binarne fajlove s binaries.prisma.sh pri postinstall-u.
# U okruženjima bez pristupa tom hostu install bi pao → skripta se ignoriše,
# a `prisma generate` se pokreće tamo gdje je mreža dozvoljena (CI/Coolify build
# ili mašina vlasnika). Vidi docs/FAZA0_IZVJESTAJ.md → "Blokera".
ignoredBuiltDependencies:
  - prisma
  - "@prisma/client"
  - "@prisma/engines"
