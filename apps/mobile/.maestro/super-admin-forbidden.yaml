appId: ba.ba101.voznipark
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Idi na prijava"
    commands:
      - tapOn: "Idi na prijava"
- extendedWaitUntil:
    visible: "Prijava"
    timeout: 30000
- assertVisible: "Prijava u mobilnu aplikaciju nije dostupna za Super Admin nalog. Koristite web portal."
- tapOn:
    id: "login-email"
- inputText: ${TEST_SUPER_ADMIN_EMAIL}
- pressKey: Enter
- assertVisible:
    id: "login-password"
- inputText: ${TEST_SUPER_ADMIN_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "login-error"
    timeout: 30000
- assertVisible: "Prijava u mobilnu aplikaciju nije dostupna za Super Admin nalog. Koristite web portal."
- assertVisible: "Prijava"
- assertNotVisible:
    id: "task-create-open"
- assertNotVisible: "Moji zadaci"
