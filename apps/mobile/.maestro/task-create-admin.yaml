appId: ba.ba101.voznipark
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Idi na prijava"
    commands:
      - tapOn: "Idi na prijava"
- extendedWaitUntil:
    visible: "Prijava"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${TEST_ADMIN_EMAIL}
- assertVisible: ${TEST_ADMIN_EMAIL}
- pressKey: Enter
- assertVisible:
    id: "login-password"
- inputText: ${TEST_ADMIN_PASSWORD}
- pressKey: Enter
- assertNotVisible: "Prijava"
- extendedWaitUntil:
    visible:
      id: "task-create-open"
    timeout: 30000
- tapOn:
    id: "task-create-open"
- assertVisible: "Novi zadatak"
- tapOn:
    id: "task-create-type-wash"
- scrollUntilVisible:
    element:
      id: "task-create-vehicle-vfm-001"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-vehicle-vfm-001"
- scrollUntilVisible:
    element:
      id: "task-create-next-step-1"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-next-step-1"
- scrollUntilVisible:
    element:
      id: "task-create-active-form"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "task-create-form-ready"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "task-create-title"
    direction: UP
    timeout: 30000
- tapOn:
    id: "task-create-title"
- inputText: "P4-E2E-${TEST_RUN_ID}"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Nastavi na obrazac"
    direction: DOWN
    timeout: 30000
- tapOn: "Nastavi na obrazac"
- scrollUntilVisible:
    element:
      text: "Vrsta pranja"
    direction: UP
    timeout: 30000
- assertVisible: "Vrsta pranja"
- tapOn: "Unutrašnje"
- scrollUntilVisible:
    element:
      id: "task-create-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-submit"
- assertVisible: "P4-E2E-${TEST_RUN_ID}"
- pressKey: Back
- assertVisible: "Moji zadaci"
- assertVisible: "P4-E2E-${TEST_RUN_ID}"
