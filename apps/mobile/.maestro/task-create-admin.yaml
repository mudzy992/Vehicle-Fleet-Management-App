appId: ba.ba101.voznipark
---
# Tok kreira zadatak kroz mobilni wizard i provjerava da se pojavi u listi.
#
# Vrsta je `FUEL_REFILL`: seedovana ORDER forma (`gorivo_nalog`) nema obaveznih
# polja ni obaveznih priloga, pa je kreiranje deterministički izvodljivo na
# emulatoru bez system photo pickera. WASH/HANDOVER/CUSTOM forme traže
# `photosBefore`/`opis`, što bi u wizardu zahtijevalo interakciju s Android
# galerijom (flaky u CI-ju). Foto-put je pokriven API pripremom u
# `prepare-claim-task.mjs` i claim tokom `task-claim-complete-lite.yaml`.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Idi na prijava"
    commands:
      - tapOn: "Idi na prijava"
- extendedWaitUntil:
    visible: "Prijava"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${TEST_ADMIN_EMAIL}
- assertVisible: ${TEST_ADMIN_EMAIL}
- pressKey: Enter
- assertVisible:
    id: "login-password"
- inputText: ${TEST_ADMIN_PASSWORD}
- pressKey: Enter
- assertNotVisible: "Prijava"
- extendedWaitUntil:
    visible:
      id: "task-create-open"
    timeout: 30000
- tapOn:
    id: "task-create-open"
- assertVisible: "Novi zadatak"
- scrollUntilVisible:
    element:
      id: "task-create-type-fuel_refill"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-type-fuel_refill"
- scrollUntilVisible:
    element:
      id: "task-create-vehicle-vfm-001"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-vehicle-vfm-001"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "task-create-next-step-1"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-next-step-1"
# Na opterećenom emulatoru tap na "Nastavi" zna biti izgubljen dok se lista
# ponovo renderuje nakon odabira vrste/vozila; ako smo i dalje na koraku 1,
# ponovi tap umjesto da tok padne na nedostajućem `task-create-active-form`.
- runFlow:
    when:
      visible: "Korak 1 od 3"
    commands:
      - tapOn:
          id: "task-create-next-step-1"
- runFlow:
    when:
      visible: "Korak 1 od 3"
    commands:
      - tapOn:
          id: "task-create-next-step-1"
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "task-create-active-form"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "task-create-form-ready"
    direction: DOWN
    timeout: 30000
- assertNotVisible:
    id: "task-create-step2-blocked-vehicle"
- scrollUntilVisible:
    element:
      id: "task-create-step2-ready"
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: "task-create-next-step-2"
# Vrsta se po defaultu dodjeljuje kao `OPEN_CLAIM` (traži pozvane korisnike), a
# tok ne bira korisnike — prebacujemo na javno preuzimanje.
- scrollUntilVisible:
    element: "Svima (ko prvi preuzme)"
    direction: DOWN
    timeout: 30000
- tapOn: "Svima (ko prvi preuzme)"
- scrollUntilVisible:
    element:
      id: "task-create-title"
    direction: UP
    timeout: 30000
- tapOn:
    id: "task-create-title"
- inputText: "P4-E2E-${TEST_RUN_ID}"
- tapOn:
    id: "task-create-next-step-2"
- assertVisible: "3. Obrazac"
- scrollUntilVisible:
    element:
      id: "task-form-field-napomena"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "task-form-field-napomena"
- scrollUntilVisible:
    element:
      id: "task-create-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-create-submit"
- assertVisible: "P4-E2E-${TEST_RUN_ID}"
- pressKey: Back
- assertVisible: "Moji zadaci"
- assertVisible: "P4-E2E-${TEST_RUN_ID}"
