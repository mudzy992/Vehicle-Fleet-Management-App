appId: ba.ba101.voznipark
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Idi na prijava"
    commands:
      - tapOn: "Idi na prijava"
- extendedWaitUntil:
    visible: "Prijava"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${TEST_USER_EMAIL}
- assertVisible: ${TEST_USER_EMAIL}
- scrollUntilVisible:
    element:
      id: "login-password"
- tapOn:
    id: "login-password"
- inputText: ${TEST_USER_PASSWORD}
- pressKey: Enter
- assertNotVisible: "Prijava"
- assertNotVisible:
    id: "task-create-open"
