appId: ba.ba101.voznipark
---
- launchApp:
    clearState: true
- assertVisible: "Prijava"
- tapOn:
    id: "login-email"
- inputText: ${TEST_USER_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${TEST_USER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "login-submit"
- assertNotVisible: "Prijava"
- assertNotVisible:
    id: "task-create-open"
