appId: ba.ba101.voznipark
---
# Claim + complete tok nad OPEN WASH zadatkom koji priprema
# `apps/mobile/scripts/prepare-claim-task.mjs`.
#
# Napomena: read-only blok naloga (sa fotografijama) je visok, pa se status i
# dugmad provjeravaju `scrollUntilVisible`-om do stabilnih testID-eva, a ne
# `visible` provjerom teksta koji može biti izvan ekrana.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Idi na prijava"
    commands:
      - tapOn: "Idi na prijava"
- extendedWaitUntil:
    visible: "Prijava"
    timeout: 30000
- tapOn:
    id: "login-email"
- inputText: ${TEST_USER_EMAIL}
- pressKey: Enter
- assertVisible:
    id: "login-password"
- inputText: ${TEST_USER_PASSWORD}
- pressKey: Enter
- assertNotVisible: "Prijava"
- extendedWaitUntil:
    visible: "Moji zadaci"
    timeout: 30000
- tapOn: "Slobodni"
- extendedWaitUntil:
    visible: ${CLAIM_TASK_TITLE}
    timeout: 30000
- tapOn: ${CLAIM_TASK_TITLE}
- scrollUntilVisible:
    element:
      id: "task-claim-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-claim-submit"
# Nestanak dugmeta znači da je zadatak preuzet (forma realizacije se tek tada
# renderuje); greška u preuzimanju ostavlja dugme na ekranu i tok pada ovdje.
- extendedWaitUntil:
    notVisible:
      id: "task-claim-submit"
    timeout: 30000
# `washType` je obavezan u formi realizacije (SINGLE_CHOICE) — bira se po
# testID-u jer se tekst „Unutrašnje" pojavljuje i u read-only nalogu iznad.
- scrollUntilVisible:
    element:
      id: "task-form-option-washType-INTERNAL"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-form-option-washType-INTERNAL"
- scrollUntilVisible:
    element:
      id: "task-complete-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "task-complete-submit"
- extendedWaitUntil:
    notVisible:
      id: "task-complete-submit"
    timeout: 30000
- scrollUntilVisible:
    element: "Završen"
    direction: UP
    timeout: 30000
- assertVisible: "Završen"
