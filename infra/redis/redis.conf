# =============================================================================
#  VFM — Redis konfiguracija za LOKALNI DEV (docker-compose.dev.yml)
#  Produkcijska konfiguracija se postavlja u Coolify → Redis → General →
#  "Custom Redis configuration". Vidi REDIS_ACL.md §2.
# =============================================================================

# ACL fajl (bez komentara u fajlu — Redis < 8.8 ih ne podržava pri ACL LOAD)
aclfile /etc/redis/users.acl

# Kada je aclfile aktivan, requirepass se IGNORIŠE — ne postavljati ga.
# `user default off` u ACL fajlu blokira anonimni pristup.

# Persistencija: BullMQ queue-ovi moraju preživjeti restart
appendonly yes
appendfsync everysec
save ""

# Queue nije keš — evikcija bi brisala jobove
maxmemory-policy noeviction

# Osnovno
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logovi
loglevel notice
logfile ""

# Sigurnost: onemogućiti opasne komande na nivou servera (dvostruki pojas)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command SHUTDOWN "VFM_SHUTDOWN_a7f3c1"
